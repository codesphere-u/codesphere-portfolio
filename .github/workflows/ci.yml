name: Portfolio CI & Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build & Verify Portfolio Data (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify zero-dependency supply chain & audit
        run: |
          node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); if(Object.keys(p.dependencies||{}).length||Object.keys(p.devDependencies||{}).length){throw new Error('Unexpected external dependencies');}"
          npm install --package-lock-only --ignore-scripts --silent
          npm audit --omit=dev
          rm -f package-lock.json

      - name: Build static bundle
        run: npm run build

      - name: Run automated test suite (21 tests)
        run: npm test
